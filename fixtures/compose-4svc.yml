services:
  web:
    image: nginx:alpine
    depends_on:
      - api
    ports:
      - "8080:80"
    networks:
      - appnet

  api:
    image: alpine:3.20
    command: ["sh", "-c", "sleep 3600"]
    depends_on:
      - redis
      - mysql
    networks:
      - appnet

  redis:
    image: redis:7-alpine
    networks:
      - appnet

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: example
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - appnet

volumes:
  mysql_data:

networks:
  appnet:
