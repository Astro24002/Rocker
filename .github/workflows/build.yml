name: desktop-build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  package:
    strategy:
      matrix:
        include:
          - os: windows-latest
            command: npm run dist:win
          - os: macos-14
            command: npm run dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: rocker-${{ runner.os }}
          path: release/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rocker-*
          path: release
          merge-multiple: true
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Rocker $GITHUB_REF_NAME" \
              --generate-notes
          fi

          gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' | while IFS= read -r existing; do
            release_version="${GITHUB_REF_NAME#v}"
            case "$existing" in
              "Rocker-v${release_version}-x64.exe"|"Rocker-v${release_version}-arm64.exe"|\
              "Rocker-v${release_version}-x64.dmg"|"Rocker-v${release_version}-arm64.dmg"|\
              "Rocker-v${release_version}-x64.zip"|"Rocker-v${release_version}-arm64.zip") ;;
              *) gh release delete-asset "$GITHUB_REF_NAME" "$existing" --repo "$GITHUB_REPOSITORY" --yes ;;
            esac
          done

          find release -type f \( -name 'Rocker-*.exe' -o -name 'Rocker-*.dmg' -o -name 'Rocker-*.zip' \) -print0 | while IFS= read -r -d '' asset; do
            gh release upload "$GITHUB_REF_NAME" "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          done
