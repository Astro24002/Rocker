name: desktop-build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Audit production dependencies
        shell: bash
        run: |
          set -o pipefail
          audit_log="$(mktemp)"
          audit_status=0
          timeout 90s env npm_config_registry=https://registry.npmjs.org npm audit --omit=dev --audit-level=moderate >"$audit_log" 2>&1 || audit_status=$?
          if [ "$audit_status" -ne 0 ]; then
            cat "$audit_log"
            if [ "$audit_status" -eq 124 ] || grep -Eqi 'EAI_AGAIN|ENETUNREACH|ECONNREFUSED|ECONNRESET|ETIMEDOUT|fetch failed|audit endpoint|service unavailable|registry unavailable' "$audit_log"; then
              echo "::error::npm audit endpoint unavailable at https://registry.npmjs.org"
            else
              echo "::error::npm audit reported vulnerabilities or failed"
            fi
            rm -f "$audit_log"
            exit 1
          fi
          cat "$audit_log"
          rm -f "$audit_log"

  package:
    needs: verify
    strategy:
      matrix:
        include:
          - os: windows-latest
            command: npm run dist:win
            artifacts: |
              release/Rocker-v*.exe
          - os: macos-14
            command: npm run dist:mac
            artifacts: |
              release/Rocker-v*.dmg
              release/Rocker-v*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: rocker-${{ runner.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rocker-*
          path: release
          merge-multiple: true
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Rocker $GITHUB_REF_NAME" \
              --generate-notes
          fi

          gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' | while IFS= read -r existing; do
            release_version="${GITHUB_REF_NAME#v}"
            case "$existing" in
              "Rocker-v${release_version}-x64.exe"|"Rocker-v${release_version}-arm64.exe"|\
              "Rocker-v${release_version}-x64.dmg"|"Rocker-v${release_version}-arm64.dmg"|\
              "Rocker-v${release_version}-x64.zip"|"Rocker-v${release_version}-arm64.zip") ;;
              *) gh release delete-asset "$GITHUB_REF_NAME" "$existing" --repo "$GITHUB_REPOSITORY" --yes ;;
            esac
          done

          echo "Downloaded release files:"
          find release -type f -print | sort
          rm -rf release-publish
          mkdir -p release-publish
          release_version="${GITHUB_REF_NAME#v}"
          missing=0
          for asset_name in \
            "Rocker-v${release_version}-x64.exe" \
            "Rocker-v${release_version}-arm64.exe" \
            "Rocker-v${release_version}-x64.dmg" \
            "Rocker-v${release_version}-arm64.dmg" \
            "Rocker-v${release_version}-x64.zip" \
            "Rocker-v${release_version}-arm64.zip"; do
            mapfile -t matches < <(find release -type f -name "$asset_name" -print)
            if [ "${#matches[@]}" -eq 1 ]; then
              asset="${matches[0]}"
              cp "$asset" "release-publish/$asset_name"
            elif [ "${#matches[@]}" -eq 0 ]; then
              echo "::error::Missing expected release asset: $asset_name"
              missing=1
            else
              echo "::error::Duplicate release asset paths for $asset_name: ${matches[*]}"
              missing=1
            fi
          done
          node scripts/verify-release-assets.mjs "$release_version" release-publish
          for asset in \
            "release-publish/Rocker-v${release_version}-x64.exe" \
            "release-publish/Rocker-v${release_version}-arm64.exe" \
            "release-publish/Rocker-v${release_version}-x64.dmg" \
            "release-publish/Rocker-v${release_version}-arm64.dmg" \
            "release-publish/Rocker-v${release_version}-x64.zip" \
            "release-publish/Rocker-v${release_version}-arm64.zip"; do
            if [ -f "$asset" ]; then
              gh release upload "$GITHUB_REF_NAME" "$asset" \
                --repo "$GITHUB_REPOSITORY" \
                --clobber
            else
              echo "::error::Missing normalized release asset: $asset"
              missing=1
            fi
          done
          exit "$missing"
